model:
  name: Qwen/Qwen3.5-0.8B-Base
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: true
  use_kernels: false

teacher:
  name: Qwen/Qwen3.5-4B
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: true
  use_kernels: false
  quantization: null

teacher_targets:
  output_dir: ./teacher_targets/qwen3.5-4b-bf16-hendrycks-math-7500-top20
  batch_size: 4
  shard_size: 32
  storage_dtype: float16

lora:
  rank: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_b
    - in_proj_a
    - out_proj

dataset:
  name: EleutherAI/hendrycks_math
  config_name: null
  config_names:
    - algebra
    - counting_and_probability
    - geometry
    - intermediate_algebra
    - number_theory
    - prealgebra
    - precalculus
  split: train
  levels: []
  prompt_template: |-
    Problem:
    {problem}

    Solve the problem. Put the final answer in \boxed{}.
    Solution:
  max_examples: 7500
  shuffle_buffer_size: 7500
  seed: 42

training:
  max_length: 2048
  per_device_train_batch_size: 2
  # 20 prompts per step times 1,500 steps gives 30,000 training prompts.
  # This makes four passes over the fixed cache of 7,500 examples.
  gradient_accumulation_steps: 10
  max_steps: 1500
  learning_rate: 0.0002
  lr_scheduler_type: linear
  warmup_ratio: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  save_steps: 50
  save_total_limit: 2
  gradient_checkpointing: true
  bf16: true
  tf32: true
  seed: 42
  resume_from_checkpoint: auto

eval:
  enabled: true
  dataset_name: HuggingFaceH4/MATH-500
  config_name: null
  split: test
  steps:
    - 50
    - 100
    - 150
    - 200
    - 250
    - 300
    - 350
    - 400
    - 450
    - 500
    - 550
    - 600
    - 650
    - 700
    - 750
    - 800
    - 850
    - 900
    - 950
    - 1000
    - 1050
    - 1100
    - 1150
    - 1200
    - 1250
    - 1300
    - 1350
    - 1400
    - 1450
    - 1500
  # Full MATH-500 evaluation every 5,000 training prompts.
  full_steps:
    - 250
    - 500
    - 750
    - 1000
    - 1250
    - 1500
  max_examples: 50
  full_max_examples: 500
  balanced: true
  seed: 42
  # This is the total prompt-and-generation limit, as in training.
  max_length: 2048
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  min_p: 0.0
  presence_penalty: 0.0
  batch_size: 8
  prompt_template: |-
    Problem:
    {problem}

    Solve the problem. Put the final answer in \boxed{}.
    Solution:

distillation:
  output_dir: ./runs/qwen3.5-0.8b-base-math-off-policy-30k-batch2
  top_k: 20
  temperature: 1.0
  wandb_run_name: qwen3.5-0.8b-base-math-off-policy-30k-batch2

logging:
  wandb_project: opd
  wandb_entity: null
