model:
  name: Qwen/Qwen3.5-2B-Base
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: true
  use_kernels: true

teacher:
  name: Qwen/Qwen3.5-9B-Base
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: true
  use_kernels: false
  quantization: int8

lora:
  rank: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_b
    - in_proj_a
    - out_proj

dataset:
  name: DigitalLearningGmbH/MATH-lighteval
  config_name: default
  split: train
  levels:
    - 3
    - 4
    - 5
  prompt_template: |-
    Problem:
    {problem}

    Solve the problem. Put the final answer in \boxed{}.
    Solution:
  max_examples: 512
  shuffle_buffer_size: 512
  seed: 42

training:
  max_length: 2048
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  max_steps: 16
  learning_rate: 0.0002
  lr_scheduler_type: linear
  warmup_ratio: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  save_steps: 8
  save_total_limit: 2
  gradient_checkpointing: true
  bf16: true
  tf32: true
  seed: 42
  resume_from_checkpoint: auto

eval:
  enabled: true
  dataset_name: HuggingFaceH4/MATH-500
  config_name: null
  split: test
  steps:
    - 8
    - 16
  max_examples: 128
  max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  batch_size: 1
  prompt_template: |-
    Problem:
    {problem}

    Solve the problem. Put the final answer in \boxed{}.
    Solution:

distillation:
  output_dir: ./runs/qwen3.5-2b-base-math-off-policy
  top_k: 20
  temperature: 1.0
  wandb_run_name: qwen3.5-2b-base-math-off-policy

logging:
  wandb_project: opd
  wandb_entity: null
